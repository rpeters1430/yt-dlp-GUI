<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <linearGradient id="uiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e121d" />
      <stop offset="100%" stop-color="#080a11" />
    </linearGradient>

    <linearGradient id="sidebarBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111625" />
      <stop offset="100%" stop-color="#0d101a" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161c2e" />
      <stop offset="100%" stop-color="#121624" />
    </linearGradient>

    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .ui-text { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
  </style>

  <!-- Main App Window Frame -->
  <rect x="2" y="2" width="996" height="576" rx="16" fill="url(#uiBg)" stroke="#1e293b" stroke-width="2" filter="url(#cardShadow)" />

  <!-- Window Header / Titlebar -->
  <rect x="2" y="2" width="996" height="42" rx="16" fill="#0b0e17" />
  <rect x="2" y="30" width="996" height="14" fill="#0b0e17" />
  <line x1="2" y1="44" x2="998" y2="44" stroke="#1e293b" stroke-width="1" />

  <!-- macOS / Window Dots -->
  <circle cx="24" cy="23" r="6" fill="#ef4444" />
  <circle cx="42" cy="23" r="6" fill="#f59e0b" />
  <circle cx="60" cy="23" r="6" fill="#10b981" />
  <text x="500" y="28" text-anchor="middle" class="ui-text" font-size="12" fill="#64748b" font-weight="600">yt-dlp GUI • Dashboard</text>

  <!-- ================= SIDEBAR ================= -->
  <rect x="2" y="44" width="200" height="534" fill="url(#sidebarBg)" />
  <line x1="202" y1="44" x2="202" y2="578" stroke="#1e293b" stroke-width="1" />

  <!-- Logo in Sidebar -->
  <rect x="18" y="62" width="26" height="26" rx="7" fill="#0284c7" />
  <path d="M 31 68 L 31 80 M 26 75 L 31 80 L 36 75" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="52" y="80" class="ui-text" font-size="14" font-weight="800" fill="#f8fafc">yt-dlp GUI</text>

  <!-- Nav Items -->
  <!-- Active Dashboard -->
  <rect x="12" y="105" width="178" height="34" rx="8" fill="#1e293b" />
  <circle cx="28" cy="122" r="3" fill="#38bdf8" />
  <text x="42" y="127" class="ui-text" font-size="13" font-weight="600" fill="#38bdf8">Dashboard</text>

  <text x="42" y="162" class="ui-text" font-size="13" font-weight="500" fill="#94a3b8">Music Hub</text>
  <text x="42" y="197" class="ui-text" font-size="13" font-weight="500" fill="#94a3b8">Twitch &amp; Live</text>
  <text x="42" y="232" class="ui-text" font-size="13" font-weight="500" fill="#94a3b8">Library &amp; Player</text>
  <text x="42" y="267" class="ui-text" font-size="13" font-weight="500" fill="#94a3b8">History</text>
  <text x="42" y="302" class="ui-text" font-size="13" font-weight="500" fill="#94a3b8">Watches</text>
  <text x="42" y="337" class="ui-text" font-size="13" font-weight="500" fill="#94a3b8">Supported Sites</text>
  <text x="42" y="372" class="ui-text" font-size="13" font-weight="500" fill="#94a3b8">Settings</text>

  <!-- Sidebar Footer User Pill -->
  <rect x="14" y="525" width="174" height="34" rx="8" fill="#151b2a" stroke="#1e293b" stroke-width="1" />
  <circle cx="32" cy="542" r="10" fill="#3b82f6" />
  <text x="32" y="546" text-anchor="middle" class="ui-text" font-size="11" font-weight="700" fill="#ffffff">A</text>
  <text x="50" y="546" class="ui-text" font-size="12" font-weight="600" fill="#e2e8f0">admin</text>
  <circle cx="168" cy="542" r="4" fill="#10b981" />

  <!-- ================= MAIN CONTENT ================= -->
  <!-- Stats Row -->
  <g transform="translate(224, 62)">
    <!-- Stat 1: Queue -->
    <rect x="0" y="0" width="175" height="64" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="24" class="ui-text" font-size="11" font-weight="600" fill="#94a3b8">DOWNLOADING</text>
    <text x="16" y="50" class="mono" font-size="22" font-weight="700" fill="#38bdf8">2 Active</text>
    <circle cx="148" cy="32" r="12" fill="#0369a1" opacity="0.3" />
    <path d="M 148 27 L 148 37 M 144 33 L 148 37 L 152 33" stroke="#38bdf8" stroke-width="1.8" />

    <!-- Stat 2: Completed -->
    <rect x="190" y="0" width="175" height="64" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <text x="206" y="24" class="ui-text" font-size="11" font-weight="600" fill="#94a3b8">COMPLETED TODAY</text>
    <text x="206" y="50" class="mono" font-size="22" font-weight="700" fill="#10b981">14</text>

    <!-- Stat 3: Watches -->
    <rect x="380" y="0" width="175" height="64" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <text x="396" y="24" class="ui-text" font-size="11" font-weight="600" fill="#94a3b8">ACTIVE WATCHES</text>
    <text x="396" y="50" class="mono" font-size="22" font-weight="700" fill="#a855f7">8 Feeds</text>

    <!-- Stat 4: Speed -->
    <rect x="570" y="0" width="180" height="64" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <text x="586" y="24" class="ui-text" font-size="11" font-weight="600" fill="#94a3b8">TOTAL SPEED</text>
    <text x="586" y="50" class="mono" font-size="22" font-weight="700" fill="#f59e0b">18.4 MB/s</text>
  </g>

  <!-- Input Panel: Add Downloads -->
  <g transform="translate(224, 142)">
    <rect x="0" y="0" width="750" height="110" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="28" class="ui-text" font-size="14" font-weight="700" fill="#f1f5f9">Add URLs</text>
    <text x="94" y="28" class="ui-text" font-size="12" font-weight="500" fill="#64748b">• YouTube, Twitch, TikTok, SoundCloud, Bandcamp...</text>

    <!-- Input Box -->
    <rect x="20" y="44" width="530" height="44" rx="8" fill="#0a0d16" stroke="#334155" stroke-width="1.2" />
    <text x="36" y="71" class="mono" font-size="12" fill="#64748b">https://www.youtube.com/watch?v=dQw4w9WgXcQ</text>

    <!-- Preset Selector -->
    <rect x="560" y="44" width="75" height="44" rx="8" fill="#13192b" stroke="#334155" stroke-width="1" />
    <text x="576" y="71" class="ui-text" font-size="12" font-weight="600" fill="#94a3b8">1080p ▾</text>

    <!-- Download Button -->
    <rect x="645" y="44" width="85" height="44" rx="8" fill="url(#btnGrad)" />
    <text x="687" y="71" text-anchor="middle" class="ui-text" font-size="13" font-weight="700" fill="#ffffff">Download</text>
  </g>

  <!-- Live Queue Section -->
  <g transform="translate(224, 272)">
    <text x="4" y="16" class="ui-text" font-size="14" font-weight="700" fill="#f1f5f9">Active Queue (2)</text>

    <!-- Queue Card 1 -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="750" height="110" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
      
      <!-- Video Thumbnail Placeholder -->
      <rect x="16" y="14" width="130" height="82" rx="6" fill="#0f172a" />
      <circle cx="81" cy="55" r="16" fill="#ef4444" opacity="0.8" />
      <polygon points="76,47 90,55 76,63" fill="#ffffff" />
      <rect x="100" y="74" width="40" height="16" rx="3" fill="#000000" opacity="0.8" />
      <text x="120" y="86" text-anchor="middle" class="mono" font-size="9" fill="#ffffff">18:42</text>

      <!-- Video Meta -->
      <text x="160" y="32" class="ui-text" font-size="14" font-weight="700" fill="#e2e8f0">Building a Production Media Homelab with Docker &amp; Jellyfin</text>
      <text x="160" y="52" class="ui-text" font-size="12" font-weight="500" fill="#64748b">TechnoTim • MP4 (1080p 60fps) • 1.42 GB</text>

      <!-- Progress Bar Track -->
      <rect x="160" y="68" width="450" height="8" rx="4" fill="#0a0d16" />
      <rect x="160" y="68" width="315" height="8" rx="4" fill="url(#accentBar)" />

      <!-- Progress Stats -->
      <text x="160" y="93" class="mono" font-size="11" font-weight="600" fill="#38bdf8">70.0%</text>
      <text x="215" y="93" class="mono" font-size="11" fill="#94a3b8">@ 12.8 MB/s</text>
      <text x="310" y="93" class="mono" font-size="11" fill="#64748b">ETA: 00:34</text>

      <!-- Badge & Action -->
      <rect x="635" y="24" width="95" height="26" rx="6" fill="#042f2e" stroke="#14b8a6" stroke-width="1" />
      <text x="682" y="41" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#2dd4bf">Downloading</text>

      <rect x="685" y="64" width="45" height="28" rx="6" fill="#1e293b" />
      <text x="707" y="82" text-anchor="middle" class="ui-text" font-size="11" fill="#94a3b8">Log</text>
    </g>

    <!-- Queue Card 2: Music Download -->
    <g transform="translate(0, 154)">
      <rect x="0" y="0" width="750" height="96" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
      
      <!-- Album Art Placeholder -->
      <rect x="16" y="14" width="68" height="68" rx="6" fill="#2e1065" />
      <circle cx="50" cy="48" r="14" fill="#8b5cf6" opacity="0.6" />
      <text x="50" y="53" text-anchor="middle" class="ui-text" font-size="16" fill="#ffffff">🎵</text>

      <!-- Music Info -->
      <text x="100" y="32" class="ui-text" font-size="13" font-weight="700" fill="#e2e8f0">Daft Punk - Random Access Memories (Lidarr Grab)</text>
      <text x="100" y="50" class="ui-text" font-size="11" font-weight="500" fill="#64748b">Track 08 / 13 • Get Lucky • OPUS (160 kbps VBR bitstream copy)</text>

      <!-- Mini Progress -->
      <rect x="100" y="62" width="510" height="6" rx="3" fill="#0a0d16" />
      <rect x="100" y="62" width="460" height="6" rx="3" fill="#10b981" />

      <text x="100" y="83" class="mono" font-size="10" font-weight="600" fill="#10b981">90.2%</text>
      <text x="145" y="83" class="mono" font-size="10" fill="#64748b">Tagging &amp; embedding high-res artwork...</text>

      <rect x="635" y="22" width="95" height="26" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1" />
      <text x="682" y="39" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#4ade80">Lidarr Sync</text>
    </g>
  </g>
</svg>
