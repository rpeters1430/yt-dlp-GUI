<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1e38" />
      <stop offset="60%" stop-color="#0d0f18" />
      <stop offset="100%" stop-color="#08090e" />
    </radialGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#4facfe" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#7928ca" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0.8" />
    </linearGradient>

    <!-- Core Emblem Neon Gradient -->
    <linearGradient id="neonGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="25%" stop-color="#00f2fe" />
      <stop offset="65%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#845ec2" />
    </linearGradient>

    <!-- Hot Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="50%" stop-color="#ff4e50" />
      <stop offset="100%" stop-color="#f9d423" />
    </linearGradient>

    <!-- Arrow Body Gradient -->
    <linearGradient id="arrowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Drop Shadow & Glow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base App Icon Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGlow)" stroke="url(#borderGrad)" stroke-width="4" filter="url(#dropShadow)" />

  <!-- Ambient Internal Aura Glow -->
  <circle cx="256" cy="240" r="140" fill="#00f2fe" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="256" cy="270" r="120" fill="#7928ca" opacity="0.15" filter="url(#softGlow)" />

  <!-- Background Sound / Streaming Visualizer Bars -->
  <g opacity="0.25">
    <!-- Left Equalizer Column -->
    <rect x="90" y="220" width="10" height="72" rx="5" fill="#4facfe" />
    <rect x="112" y="180" width="10" height="152" rx="5" fill="#00f2fe" />
    <rect x="134" y="240" width="10" height="32" rx="5" fill="#38ef7d" />

    <!-- Right Equalizer Column -->
    <rect x="368" y="235" width="10" height="42" rx="5" fill="#ff0080" />
    <rect x="390" y="175" width="10" height="162" rx="5" fill="#845ec2" />
    <rect x="412" y="215" width="10" height="82" rx="5" fill="#4facfe" />
  </g>

  <!-- Dynamic Speed Stream Ribbons (Surrounding the central badge) -->
  <path d="M 120,380 C 180,430 332,430 392,380" fill="none" stroke="url(#borderGrad)" stroke-width="6" stroke-linecap="round" opacity="0.7" />
  <circle cx="256" cy="415" r="4" fill="#00f2fe" filter="url(#softGlow)" />

  <!-- Media Play Crest with Download Vector Centerpiece -->
  <!-- Outer Play Triangle Facet (Rightward forward tilt symbolizing media & stream) -->
  <g filter="url(#softGlow)">
    <!-- Backing Geometric Play / Media Diamond Shield -->
    <path d="M 180 130 
             C 180 118, 194 110, 204 116
             L 364 216 
             C 374 222, 374 238, 364 244
             L 204 344 
             C 194 350, 180 342, 180 330 
             Z" 
          fill="none" 
          stroke="url(#neonGrad)" 
          stroke-width="14" 
          stroke-linejoin="round"
          stroke-linecap="round"
          opacity="0.95" />
  </g>

  <!-- The Bold Download Harpoon Arrow (Seamlessly anchored in the play symbol) -->
  <g filter="url(#intenseGlow)">
    <!-- Arrow Shaft with Gradient Depth -->
    <path d="M 236 150 
             L 276 150 
             C 282 150, 286 154, 286 160 
             L 286 265 
             L 326 265 
             C 334 265, 338 275, 332 281 
             L 262 355 
             C 258 359, 254 359, 250 355 
             L 180 281 
             C 174 275, 178 265, 186 265 
             L 226 265 
             L 226 160 
             C 226 154, 230 150, 236 150 
             Z" 
          fill="url(#arrowGrad)" 
          stroke="#00f2fe" 
          stroke-width="3" 
          stroke-linejoin="round" />

    <!-- Interior Arrow Accent Cutout / Highlight -->
    <path d="M 256 165 L 256 335" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <polygon points="256,340 244,324 268,324" fill="#00f2fe" opacity="0.7" />
  </g>

  <!-- Speed / Precision Notch on the Play Tip -->
  <circle cx="366" cy="230" r="7" fill="#ff0080" filter="url(#softGlow)" />
  <circle cx="366" cy="230" r="3" fill="#ffffff" />

  <!-- Bottom Media Storage / Target Tray Base -->
  <path d="M 180 380 L 332 380" stroke="url(#neonGrad)" stroke-width="10" stroke-linecap="round" />
</svg>
