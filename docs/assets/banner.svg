<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14" />
      <stop offset="50%" stop-color="#0f1322" />
      <stop offset="100%" stop-color="#07080d" />
    </linearGradient>

    <radialGradient id="leftAura" cx="15%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#4facfe" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="rightAura" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#ff0080" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="bannerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.7" />
      <stop offset="35%" stop-color="#4facfe" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#7928ca" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="logoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <linearGradient id="neonPlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 64px;
      letter-spacing: -1.5px;
    }
    .tagline-text {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: -0.2px;
    }
    .pill-text {
      font-family: 'JetBrains Mono', monospace, Consolas, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .status-text {
      font-family: 'JetBrains Mono', monospace, Consolas, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #34d399;
    }
  </style>

  <!-- Banner Card Container -->
  <rect x="8" y="8" width="1184" height="364" rx="28" fill="url(#bgGrad)" stroke="url(#bannerBorder)" stroke-width="2.5" />

  <!-- Ambient Glow Effects -->
  <rect x="8" y="8" width="1184" height="364" rx="28" fill="url(#leftAura)" />
  <rect x="8" y="8" width="1184" height="364" rx="28" fill="url(#rightAura)" />

  <!-- Decorative Matrix / Dot Grid on Right Side -->
  <g opacity="0.12" fill="#38bdf8">
    <circle cx="850" cy="70" r="2" /><circle cx="890" cy="70" r="2" /><circle cx="930" cy="70" r="2" /><circle cx="970" cy="70" r="2" /><circle cx="1010" cy="70" r="2" /><circle cx="1050" cy="70" r="2" /><circle cx="1090" cy="70" r="2" /><circle cx="1130" cy="70" r="2" />
    <circle cx="850" cy="100" r="2" /><circle cx="890" cy="100" r="2" /><circle cx="930" cy="100" r="2" /><circle cx="970" cy="100" r="2" /><circle cx="1010" cy="100" r="2" /><circle cx="1050" cy="100" r="2" /><circle cx="1090" cy="100" r="2" /><circle cx="1130" cy="100" r="2" />
    <circle cx="850" cy="130" r="2" /><circle cx="890" cy="130" r="2" /><circle cx="930" cy="130" r="2" /><circle cx="970" cy="130" r="2" /><circle cx="1010" cy="130" r="2" /><circle cx="1050" cy="130" r="2" /><circle cx="1090" cy="130" r="2" /><circle cx="1130" cy="130" r="2" />
    <circle cx="850" cy="160" r="2" /><circle cx="890" cy="160" r="2" /><circle cx="930" cy="160" r="2" /><circle cx="970" cy="160" r="2" /><circle cx="1010" cy="160" r="2" /><circle cx="1050" cy="160" r="2" /><circle cx="1090" cy="160" r="2" /><circle cx="1130" cy="160" r="2" />
  </g>

  <!-- Left Side: Integrated Logo Emblem -->
  <g transform="translate(64, 60)">
    <!-- Squircle Backdrop -->
    <rect x="0" y="0" width="260" height="260" rx="58" fill="#111422" stroke="url(#logoBorder)" stroke-width="3.5" filter="url(#glow)" />
    
    <!-- Aura inside icon -->
    <circle cx="130" cy="130" r="90" fill="#00f2fe" opacity="0.14" />
    <circle cx="130" cy="140" r="70" fill="#7928ca" opacity="0.18" />

    <!-- Equalizer accents -->
    <g opacity="0.3">
      <rect x="35" y="115" width="6" height="40" rx="3" fill="#4facfe" />
      <rect x="47" y="90" width="6" height="85" rx="3" fill="#00f2fe" />
      <rect x="207" y="90" width="6" height="90" rx="3" fill="#ff0080" />
      <rect x="219" y="110" width="6" height="45" rx="3" fill="#845ec2" />
    </g>

    <!-- Play Frame Geometric Shape -->
    <path d="M 85 65 
             C 85 58, 93 54, 99 57 
             L 194 116 
             C 200 120, 200 130, 194 134 
             L 99 193 
             C 93 196, 85 192, 85 185 
             Z" 
          fill="none" 
          stroke="url(#neonPlay)" 
          stroke-width="9" 
          stroke-linejoin="round"
          stroke-linecap="round" />

    <!-- Arrow Core -->
    <path d="M 118 78 
             L 142 78 
             C 145 78, 148 81, 148 84 
             L 148 145 
             L 172 145 
             C 177 145, 179 151, 175 155 
             L 134 198 
             C 132 200, 128 200, 126 198 
             L 85 155 
             C 81 151, 83 145, 88 145 
             L 112 145 
             L 112 84 
             C 112 81, 115 78, 118 78 
             Z" 
          fill="#ffffff" 
          stroke="#00f2fe" 
          stroke-width="2.5" 
          stroke-linejoin="round" />

    <!-- Play tip hot accent -->
    <circle cx="196" cy="125" r="5" fill="#ff0080" />

    <!-- Bottom Tray Line -->
    <path d="M 85 214 L 175 214" stroke="url(#neonPlay)" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Right Side: Header & Feature Showcase -->
  <g transform="translate(370, 75)">
    <!-- Status / Environment Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="32" rx="16" fill="#13202e" stroke="#059669" stroke-width="1.5" />
      <circle cx="20" cy="16" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="34" y="21" class="status-text">v1.0 • ACTIVE DEV</text>
      <line x1="145" y1="8" x2="145" y2="24" stroke="#1f3b39" stroke-width="1.5" />
      <text x="156" y="21" class="pill-text" fill="#94a3b8" style="font-size: 11px;">MULTI-ARCH</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="90" class="title-text" fill="url(#textGrad)">yt-dlp GUI</text>

    <!-- Subtitle -->
    <text x="0" y="128" class="tagline-text">
      Modern self-hosted media downloader, live stream recorder &amp; automated audio hub
    </text>

    <!-- Badges / Tech & Feature Pills Row 1 -->
    <g transform="translate(0, 160)">
      <!-- Pill 1: Docker -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="110" height="32" rx="8" fill="#161b2e" stroke="url(#badgeBorder)" stroke-width="1.2" />
        <text x="14" y="21" class="pill-text">🐳 Docker</text>
      </g>

      <!-- Pill 2: Lidarr -->
      <g transform="translate(122, 0)">
        <rect x="0" y="0" width="168" height="32" rx="8" fill="#161b2e" stroke="url(#badgeBorder)" stroke-width="1.2" />
        <text x="14" y="21" class="pill-text">🎵 Lidarr &amp; Torznab</text>
      </g>

      <!-- Pill 3: Live Streams -->
      <g transform="translate(302, 0)">
        <rect x="0" y="0" width="160" height="32" rx="8" fill="#161b2e" stroke="url(#badgeBorder)" stroke-width="1.2" />
        <text x="14" y="21" class="pill-text">🔴 Live Stream Hub</text>
      </g>

      <!-- Pill 4: Jellyfin / Plex -->
      <g transform="translate(474, 0)">
        <rect x="0" y="0" width="165" height="32" rx="8" fill="#161b2e" stroke="url(#badgeBorder)" stroke-width="1.2" />
        <text x="14" y="21" class="pill-text">📺 Jellyfin &amp; Plex</text>
      </g>
    </g>

    <!-- Badges / Tech & Feature Pills Row 2 -->
    <g transform="translate(0, 202)">
      <!-- Pill 5: Watches -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="155" height="32" rx="8" fill="#161b2e" stroke="url(#badgeBorder)" stroke-width="1.2" />
        <text x="14" y="21" class="pill-text">⚡ Auto-Watches</text>
      </g>

      <!-- Pill 6: WebSocket -->
      <g transform="translate(167, 0)">
        <rect x="0" y="0" width="158" height="32" rx="8" fill="#161b2e" stroke="url(#badgeBorder)" stroke-width="1.2" />
        <text x="14" y="21" class="pill-text">⚡ Live WebSockets</text>
      </g>

      <!-- Pill 7: Music -->
      <g transform="translate(337, 0)">
        <rect x="0" y="0" width="160" height="32" rx="8" fill="#161b2e" stroke="url(#badgeBorder)" stroke-width="1.2" />
        <text x="14" y="21" class="pill-text">🎧 OPUS • FLAC • MP3</text>
      </g>

      <!-- Pill 8: Webhooks -->
      <g transform="translate(509, 0)">
        <rect x="0" y="0" width="145" height="32" rx="8" fill="#161b2e" stroke="url(#badgeBorder)" stroke-width="1.2" />
        <text x="14" y="21" class="pill-text">🔔 Webhooks</text>
      </g>
    </g>
  </g>
</svg>
