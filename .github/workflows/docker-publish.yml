name: Build and publish validated Docker image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: v0.75.0

jobs:
  test:
    name: Test server and build client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci --omit=optional --no-audit --no-fund
      - name: Test server
        working-directory: server
        run: npm test
      - name: Install client dependencies
        working-directory: client
        run: npm ci --no-audit --no-fund
      - name: Build client
        working-directory: client
        run: npm run build
  build-and-push:
    name: Validate and publish container
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compute image references
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          name="ghcr.io/${REPOSITORY,,}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "candidate=$name:ci-staging-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # The GHA layer cache would otherwise keep serving a stale `apt-get upgrade`
      # layer, so Debian security fixes never land and the Trivy gate fails. Key
      # that layer on the security archive's publish date so it rebuilds exactly
      # when new security updates are available.
      - name: Compute apt refresh key
        id: apt
        run: |
          set -eu
          key=$(curl --retry 3 -fsSL https://deb.debian.org/debian-security/dists/bookworm-security/InRelease \
            | sed -n 's/^Date: //p' | head -n1) || true
          if [ -z "$key" ]; then key="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; fi
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # PRs load an amd64 candidate locally. Releases push a multiarch staging
      # index, validate both architectures by digest, then promote that index.
      - name: Build candidate image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}
          tags: ${{ steps.image.outputs.candidate }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APT_REFRESH=${{ steps.apt.outputs.key }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUBLISH == 'true' }}

      - name: Select exact image for validation
        id: candidate
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          LOCAL_TAG: ${{ steps.image.outputs.candidate }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ "$PUBLISH" = true ]; then
            test -n "$DIGEST"
            echo "ref=$IMAGE_NAME@$DIGEST" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$LOCAL_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify runtime on each release architecture
        env:
          CANDIDATE: ${{ steps.candidate.outputs.ref }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          platforms=linux/amd64
          if [ "$PUBLISH" = true ]; then platforms="$platforms linux/arm64"; fi
          for platform in $platforms; do
            image="$CANDIDATE"
            if [ "$PUBLISH" = true ]; then
              architecture="${platform#linux/}"
              digest=$(docker buildx imagetools inspect --raw "$CANDIDATE" | \
                jq -er --arg architecture "$architecture" '
                  [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture) | .digest]
                  | if length == 1 then .[0] else error("expected exactly one platform manifest") end')
              image="$IMAGE_NAME@$digest"
            fi
            bash scripts/ci/docker-smoke.sh "$image" "$platform"
          done

      - name: Scan amd64 candidate for fixable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ steps.candidate.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          version: ${{ env.TRIVY_VERSION }}

      - name: Scan arm64 candidate for fixable vulnerabilities
        if: env.PUBLISH == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ steps.candidate.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          version: ${{ env.TRIVY_VERSION }}

      - name: Promote validated digest to release tags
        if: env.PUBLISH == 'true'
        env:
          SOURCE: ${{ steps.candidate.outputs.ref }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create -t "$tag" "$SOURCE"
          done <<< "$RELEASE_TAGS"

      - name: Record validated image and rollback references
        if: env.PUBLISH == 'true'
        env:
          SOURCE: ${{ steps.candidate.outputs.ref }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '### Validated Docker image'
            echo "Commit: $GITHUB_SHA"
            echo "Image: $SOURCE"
            echo 'Use the digest to restore this exact image; commit tags can move on reruns.'
            echo '```text'
            echo "$RELEASE_TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
