name: Build and publish validated Docker image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
  # Install the newest Trivy release on every run (trivy-action defaults to an
  # older pinned binary). `latest` is resolved by aquasecurity/setup-trivy.
  TRIVY_VERSION: latest

jobs:
  test:
    name: Test server and build client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci --omit=optional --no-audit --no-fund
      - name: Test build tool resolution
        run: node --test scripts/ci/resolve-tools.test.mjs
      - name: Lint server
        working-directory: server
        run: npm run lint
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg python3-mutagen
      - name: Test server (with coverage report)
        working-directory: server
        run: PYTHON_BIN=/usr/bin/python3 npm run test:coverage
      - name: Install client dependencies
        working-directory: client
        run: npm ci --no-audit --no-fund
      - name: Lint client
        working-directory: client
        run: npm run lint
      - name: Test client
        working-directory: client
        run: npm test
      - name: Build client
        working-directory: client
        run: npm run build
  build-and-push:
    name: Validate and publish container
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build versioned release notes
        id: release-notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: mikepenz/release-changelog-builder-action@aa013739bbc8e7067dbbecd4525ff11aeb51a84b # v6.4.0
        with:
          mode: COMMIT
          failOnError: true
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "categories": [
                { "title": "## Features", "labels": ["feat", "feature"] },
                { "title": "## Fixes", "labels": ["fix", "bug"] },
                { "title": "## Other changes", "labels": [] }
              ],
              "label_extractor": [
                { "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?: ([\\w ])+([\\s\\S]*)", "on_property": "title", "target": "$1" }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Embed changelog and image revision
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_CHANGELOG: ${{ steps.release-notes.outputs.changelog }}
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -eu
          if [ -n "$TAG_NAME" ]; then
            VERSION="${TAG_NAME#v}"
            NOTES="$RELEASE_CHANGELOG"
          elif [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            VERSION="build-${GITHUB_SHA::12}"
            NOTES=$(git log --format='- %s (%h)' "$EVENT_BEFORE..$GITHUB_SHA")
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="build-${GITHUB_SHA::12}"
            NOTES=$(git log -1 --format='- %s (%h)' "$GITHUB_SHA")
          else
            VERSION="build-${GITHUB_SHA::12}"
            NOTES="- Initial image build (${GITHUB_SHA::12})"
          fi
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="- Container image updated (${GITHUB_SHA::12})"
          fi
          BUILD_VERSION="$VERSION" BUILD_REVISION="$GITHUB_SHA" RELEASE_NOTES="$NOTES" python3 - <<'PY'
          import json, os
          with open('build-info.json', 'w', encoding='utf-8') as output:
              json.dump({
                  'version': os.environ['BUILD_VERSION'],
                  'revision': os.environ['BUILD_REVISION'],
                  'notes': os.environ['RELEASE_NOTES'],
              }, output, ensure_ascii=False, indent=2)
              output.write('\n')
          PY

      - name: Compute image references
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          name="ghcr.io/${REPOSITORY,,}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "candidate=$name:ci-staging-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # The GHA layer cache would otherwise keep serving a stale `apt-get upgrade`
      # layer, so Debian security fixes never land and the Trivy gate fails. Key
      # that layer on the security archive's publish date so it rebuilds exactly
      # when new security updates are available.
      - name: Compute apt refresh key
        id: apt
        run: |
          set -eu
          key=$(curl --retry 3 -fsSL https://deb.debian.org/debian-security/dists/bookworm-security/InRelease \
            | sed -n 's/^Date: //p' | head -n1) || true
          if [ -z "$key" ]; then key="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; fi
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # PRs load an amd64 candidate locally. Releases push a multiarch staging
      # index, validate both architectures by digest, then promote that index.
      - name: Resolve latest yt-dlp nightly and FFmpeg autobuild
        id: tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/resolve-tools.mjs --output "$RUNNER_TEMP/build-tools"

      - name: Build candidate image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}
          tags: ${{ steps.image.outputs.candidate }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APT_REFRESH=${{ steps.apt.outputs.key }}
            TOOL_MANIFEST=${{ steps.tools.outputs.manifest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUBLISH == 'true' }}

      - name: Select exact image for validation
        id: candidate
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          LOCAL_TAG: ${{ steps.image.outputs.candidate }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ "$PUBLISH" = true ]; then
            test -n "$DIGEST"
            echo "ref=$IMAGE_NAME@$DIGEST" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$LOCAL_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify runtime on each release architecture
        env:
          CANDIDATE: ${{ steps.candidate.outputs.ref }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          platforms=linux/amd64
          if [ "$PUBLISH" = true ]; then platforms="$platforms linux/arm64"; fi
          for platform in $platforms; do
            image="$CANDIDATE"
            if [ "$PUBLISH" = true ]; then
              architecture="${platform#linux/}"
              digest=$(docker buildx imagetools inspect --raw "$CANDIDATE" | \
                jq -er --arg architecture "$architecture" '
                  [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture) | .digest]
                  | if length == 1 then .[0] else error("expected exactly one platform manifest") end')
              image="$IMAGE_NAME@$digest"
            fi
            bash scripts/ci/docker-smoke.sh "$image" "$platform"
          done

      - name: Scan amd64 candidate for fixable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ steps.candidate.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          version: ${{ env.TRIVY_VERSION }}

      - name: Scan arm64 candidate for fixable vulnerabilities
        if: env.PUBLISH == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ steps.candidate.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          version: ${{ env.TRIVY_VERSION }}

      - name: Promote validated digest to release tags
        if: env.PUBLISH == 'true'
        env:
          SOURCE: ${{ steps.candidate.outputs.ref }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create -t "$tag" "$SOURCE"
          done <<< "$RELEASE_TAGS"

      - name: Record validated image and rollback references
        if: env.PUBLISH == 'true'
        env:
          SOURCE: ${{ steps.candidate.outputs.ref }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '### Validated Docker image'
            echo "Commit: $GITHUB_SHA"
            echo "Image: $SOURCE"
            echo 'Use the digest to restore this exact image; commit tags can move on reruns.'
            echo '```text'
            echo "$RELEASE_TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  create-release:
    name: Create GitHub release notes
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build release changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@aa013739bbc8e7067dbbecd4525ff11aeb51a84b # v6.4.0
        with:
          mode: COMMIT
          failOnError: true
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "categories": [
                { "title": "## Features", "labels": ["feat", "feature"] },
                { "title": "## Fixes", "labels": ["fix", "bug"] },
                { "title": "## Other changes", "labels": [] }
              ],
              "label_extractor": [
                { "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?: ([\\w ])+([\\s\\S]*)", "on_property": "title", "target": "$1" }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release if one does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "$RELEASE_CHANGELOG"
          fi
