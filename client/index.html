<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161412" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)" />
    <title>yt-dlp GUI</title>
    <!-- Non-blocking progressive font enhancement so air-gapped/offline LAN setups never stall initial render -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      />
    </noscript>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ytdlp-gui-theme');
          if (t === 'light' || t === 'dark' || t === 'midnight') document.documentElement.setAttribute('data-theme', t);
          var d = localStorage.getItem('ytdlp-gui-density');
          if (d === 'compact') document.documentElement.setAttribute('data-density', 'compact');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
