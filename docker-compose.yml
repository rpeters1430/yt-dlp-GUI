services:
  ytdlp-gui:
    build: .
    image: ghcr.io/rpeters1430/yt-dlp-gui:latest
    container_name: ytdlp-gui
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - MAX_CONCURRENT_DOWNLOADS=2
      - TZ=America/Los_Angeles
      # Optional NAS user/group IDs so downloaded files match your host user permissions:
      # - PUID=1000
      # - PGID=1000
      # Separate folders for videos and music. Remove these (and their mounts below) to keep
      # everything under /downloads. Settings → File naming / Music can still override them.
      - VIDEO_DIR=/videos
      - MUSIC_DIR=/music
      # Optional Solverr forward proxy (see README "Solverr proxy"). The CA is installed at
      # container start; yt-dlp uses the proxy only while Solverr is reachable.
      # - SOLVERR_PROXY_URL=http://USER:PASSWORD@solverr:8192
      # - SOLVERR_PROXY_CA_URL=http://solverr:8191/proxy-ca.crt
      # - SOLVERR_PROXY_CA_SHA256=<fingerprint from Solverr startup log>
    volumes:
      - ./downloads:/downloads
      - ./videos:/videos
      - ./music:/music
      - ./config:/config
